# Render Blueprint — https://render.com/docs/blueprint-spec
# Render 대시보드 → New → Blueprint → 이 저장소 선택하면 아래 설정대로 만들어집니다.
services:
  - type: web
    name: healix
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # 아래 값들은 Render 대시보드에서 직접 입력 (저장소에 올리지 않음)
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
